name: ML Pipeline (CI/CD)

# Пайплайн запускается при пуше в ветку main
on:
  push:
    branches: [ "main", "lab2" ]
  pull_request:
    branches: [ "main", "lab2" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем репозиторий
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Настраиваем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем библиотеки
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Трюк для CI: генерируем мини-датасет для сборки и тестов
    - name: Prepare Data and Train Model
      run: |
        mkdir -p data
        python -c "import pandas as pd; pd.DataFrame({'v1':['ham','spam','ham','spam','ham','spam'], 'v2':['Hey, are we still on for lunch today?', 'WINNER! You have been selected for a cash prize! Call now!', 'Just checking in.', 'URGENT cash prize call now', 'Call me when you are free', 'win free money now']}).to_csv('data/spam.csv', index=False)"
        python src/train.py

    # 5. CD ЭТАП: Прогоняем автотесты
    - name: Run Tests
      run: |
        python -m pytest

    # 6. Логинимся в DockerHub используя секреты
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 7. CI ЭТАП: Собираем Docker-образ и пушим его
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Образ будет называться: твой_логин/spam_classifier:latest
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/spam_classifier:latest